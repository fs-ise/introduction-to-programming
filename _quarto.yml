project:
  type: website
  output-dir: _site
  pre-render: python scripts/generate_materials_overview.py
metadata-files:
  - course.yml
quarto-required: ">=1.8.0"
filters:
  - scripts/mermaid_style.lua
website:
  title: "Introduction to Programming"
  repo-url: "{{< meta repository.url >}}"
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    search: true
    contents:
      - text: Home
        href: index.qmd
      - text: Student guide
        href: student_guide.qmd
      - text: Syllabus
        href: syllabus.qmd
      - text: Objectives
        href: objectives.qmd
      - text: Materials
        href: materials.qmd
      - href: resources.qmd

format:
  html:
    theme: cosmo
    toc: false
    css:
      - assets/styles.css
      - assets/mermaid.css
    include-after-body: assets/repo-actions-bottom.html
    grid:
      sidebar-width: 280px
      body-width: 1000px
      margin-width: 280px
      gutter-width: 1.5rem


format-links: false

bibliography: references.bib
execute:
  freeze: auto
