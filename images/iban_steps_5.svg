<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
<title id="title">IBAN construction and verification, stage 6</title>
<desc id="desc">Subtract the remainder from 98 to calculate check digits 88.</desc>
<style>text { font-family: Arial, Helvetica, sans-serif; } .mono { font-family: Consolas, "Liberation Mono", monospace; }</style>
<rect width="1600" height="1400" fill="#FFFFFF"/>
<rect x="35" y="25" width="1530" height="725" rx="16" fill="#FBFDFE" stroke="#B8CEDF" stroke-width="2"/>
<text x="80" y="78" font-size="36" font-weight="700" fill="#00549F" text-anchor="start" class="">CREATE IBAN</text>
<text x="105" y="135" font-size="27" font-weight="600" fill="#52616B" text-anchor="start" class="">Bank code</text>
<text x="500" y="135" font-size="29" font-weight="700" fill="#17212B" text-anchor="start" class="mono">50070010</text>
<text x="105" y="180" font-size="27" font-weight="600" fill="#52616B" text-anchor="start" class="">Account number</text>
<text x="500" y="180" font-size="29" font-weight="700" fill="#17212B" text-anchor="start" class="mono">0175526303</text>
<text x="105" y="225" font-size="27" font-weight="600" fill="#52616B" text-anchor="start" class="">Map country code</text>
<text x="500" y="225" font-size="29" font-weight="700" fill="#17212B" text-anchor="start" class="mono">DE</text>
<text x="560" y="225" font-size="29" font-weight="700" fill="#00549F" text-anchor="start" class="mono">→  1314</text>
<text x="105" y="292" font-size="27" font-weight="600" fill="#52616B" text-anchor="start" class="">Concatenate</text>
<text x="500" y="292" font-size="29" font-weight="600" fill="#17212B" text-anchor="start" class="mono">&#x27;50070010&#x27; + &#x27;0175526303&#x27;</text>
<text x="500" y="332" font-size="29" font-weight="600" fill="#17212B" text-anchor="start" class="mono">+ &#x27;1314&#x27; + &#x27;00&#x27;</text>
<text x="500" y="372" font-size="29" font-weight="700" fill="#17212B" text-anchor="start" class="mono">= &#x27;500700100175526303131400&#x27;</text>
<text x="105" y="430" font-size="27" font-weight="600" fill="#52616B" text-anchor="start" class="">Convert to integer</text>
<text x="500" y="430" font-size="29" font-weight="700" fill="#17212B" text-anchor="start" class="mono">500700100175526303131400</text>
<text x="105" y="492" font-size="27" font-weight="600" fill="#52616B" text-anchor="start" class="">Calculate mod 97</text>
<text x="500" y="492" font-size="29" font-weight="700" fill="#17212B" text-anchor="start" class="mono">500700100175526303131400 mod 97 = 10</text>
<text x="105" y="554" font-size="27" font-weight="600" fill="#52616B" text-anchor="start" class="">Calculate check digits</text>
<rect x="490" y="516" width="260" height="52" rx="8" fill="#FFF3CD"/>
<text x="510" y="554" font-size="31" font-weight="700" fill="#9A6700" text-anchor="start" class="mono">98 − 10 = 88</text>
</svg>
